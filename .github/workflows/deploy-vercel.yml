name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK GitHub Actions secret"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --write-out 'Vercel deploy hook returned HTTP %{http_code}\n' --request POST "$VERCEL_DEPLOY_HOOK"
